name: AI News Hub - \u6bcf\u65e5\u91c7\u96c6

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore historical data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data/
          key: ai-news-data-${{ github.run_id }}
          restore-keys: |
            ai-news-data-

      - name: Run collection
        run: python run.py

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
